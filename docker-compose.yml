version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sat_exam
      POSTGRES_PASSWORD: sat_exam
      POSTGRES_DB: sat_exam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://sat_exam:sat_exam@db:5432/sat_exam
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      DEBUG: "true"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: arq app.worker.main.WorkerSettings
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://sat_exam:sat_exam@db:5432/sat_exam
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
